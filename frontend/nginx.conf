server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # config.js se genera en runtime y NO debe cachearse: contiene la API_URL
    # actual (IP Tailscale de la Maquina A + NodePort del backend).
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # index.html NUNCA se cachea: asi cada nuevo despliegue se ve al instante
    # (el navegador siempre revalida y toma los bundles nuevos con hash).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los assets con hash en el nombre (index-XXXX.js/css) son inmutables:
    # se pueden cachear para siempre sin riesgo (el hash cambia al recompilar).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier ruta desconocida sirve index.html
    # (imprescindible para React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
